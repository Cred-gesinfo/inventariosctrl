<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inventario</title>
<meta name="theme-color" content="#1F4D45">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventario">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0EE;--card:#fff;--ink:#17211F;--mute:#5E6B67;--line:#CBD3D0;--pine:#1F4D45;--red:#B3402A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--pine);background:var(--pine);color:#fff;padding:.5rem .9rem;border-radius:6px}
button.sec{background:transparent;color:var(--pine)}
button.del{border-color:var(--red);background:transparent;color:var(--red)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7FB5A9;outline-offset:1px}
input,select,textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:#fff}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .2rem}
header{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;padding:.8rem 1.2rem;background:var(--pine);color:#fff}
header h1{margin:0;font-size:1.25rem}
nav{display:flex;gap:.3rem;flex-wrap:wrap}
nav button{background:transparent;border-color:transparent;color:#cfe3de}
nav button.on{background:#fff;color:var(--pine)}
header .r{display:flex;gap:.6rem;align-items:center;font-size:.9rem}
header .r button{background:transparent;border-color:#8fb5ac}
main{max-width:1100px;margin:0 auto;padding:1.2rem}
.bar{display:flex;gap:.6rem;margin-bottom:1rem}
.bar input{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
.p{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.p>a{display:block}
.p>a img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#dfe5e2;display:block}
.p>div{padding:.8rem;display:flex;flex-direction:column;gap:.15rem;flex:1}
.p b{font-size:1.05rem}.mute{color:var(--mute);font-size:.9rem}
.stock{font-weight:700}.stock.low{color:var(--red)}
.acts{display:flex;gap:.4rem;margin-top:.6rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
table{width:100%;border-collapse:collapse}
td,th{padding:.45rem .5rem;border-bottom:1px solid var(--line);text-align:left}
.in{color:var(--pine);font-weight:700}.out{color:var(--red);font-weight:700}
dialog{border:1px solid var(--line);border-radius:12px;padding:1.2rem;width:min(520px,94vw)}
dialog::backdrop{background:#0008}
.box{max-width:360px;margin:12vh auto;background:var(--card);padding:1.4rem;border-radius:10px;border:1px solid var(--line)}
.err{color:var(--red);font-size:.9rem;min-height:1.3rem}
.row{display:flex;gap:.5rem;align-items:end}.row>*{flex:1}
.th{position:relative;flex:0 0 74px!important}.th img{width:74px;height:74px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.th button{position:absolute;top:2px;right:2px;padding:0 .35rem;background:var(--red);border-color:var(--red)}
.cnt{display:flex;gap:.3rem;margin-top:.3rem}.cnt img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px}

/* ---- Operación cómoda en celular ---- */
button,input,select,textarea{min-height:46px;touch-action:manipulation}
button{font-weight:600}
input[type=checkbox]{min-height:0;width:26px!important;height:26px}
nav svg{display:none}
.seg{display:flex;gap:.4rem}
.seg button{flex:1;min-height:54px;background:#fff;color:var(--pine);border-color:var(--line);font-size:1rem}
.seg button.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.seg button[data-v=out].on{background:var(--red);border-color:var(--red)}
.step{display:flex;gap:.4rem}
.step button{flex:0 0 58px;font-size:1.5rem;padding:0}
.step input{text-align:center;font-size:1.3rem;font-weight:700}
.mv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;margin-bottom:.6rem}
.mvh{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}.mvh b{font-size:1.1rem}
.tag{font-size:.8rem;font-weight:700;padding:.1rem .55rem;border-radius:999px;background:#E3EEEA;color:var(--pine)}
.tag.out{background:#F6DDD7;color:var(--red)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:999px;z-index:50;max-width:90vw}
.sheetbar{position:sticky;bottom:-1rem;background:#fff;padding:.8rem 0 .2rem;margin-top:1rem;border-top:1px solid var(--line)}
.sheetbar button{flex:1;min-height:50px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:.5rem 0;flex-wrap:wrap}
@media (max-width:700px){
 header{padding:.6rem 1rem;padding-top:calc(.6rem + env(safe-area-inset-top))}
 header h1{font-size:1.05rem}
 header .r #who{display:none}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:.25rem .25rem calc(.25rem + env(safe-area-inset-bottom));gap:.15rem;flex-wrap:nowrap}
 nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;padding:.3rem 0;font-size:.72rem;color:var(--mute);border:0;background:transparent}
 nav button.on{background:#E3EEEA;color:var(--pine)}
 nav svg{display:block;width:24px;height:24px}
 main{padding:.7rem .8rem calc(96px + env(safe-area-inset-bottom))}
 .row{flex-wrap:wrap}.row>*{flex:1 1 100%}
 .grid{grid-template-columns:1fr;gap:.7rem}
 .p{flex-direction:row}
 .p>a{flex:0 0 112px}
 .p>a img{height:100%;aspect-ratio:auto;min-height:130px}
 .cnt{display:none}
 .acts{flex-wrap:wrap}.acts button{flex:1 1 auto}
 .bar #q,.bar #qc{flex:1 1 100%;max-width:none}
 #new{position:fixed;right:1rem;bottom:calc(88px + env(safe-area-inset-bottom));z-index:25;border-radius:999px;padding:.85rem 1.3rem;box-shadow:0 4px 14px #0004;min-height:52px}
 dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border:0;border-radius:0;padding:1rem}
}

.r2{flex-wrap:wrap}.r2>*{flex:1 1 45%!important;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.8rem}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.6rem .3rem;text-align:center}
.kpi b{display:block;font-size:1.4rem}.kpi span{font-size:.8rem;color:var(--mute)}
h3.gh{display:flex;justify-content:space-between;gap:.5rem;font-size:1rem;margin:1rem 0 .4rem}
h3.gh span:last-child:not(:first-child){color:var(--mute);font-weight:400;font-size:.9rem}
.ir{display:flex;gap:.7rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.5rem;margin-bottom:.5rem}
.ir img,.ir .ph{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:0 0 auto;background:#dfe5e2}
.ir .t{flex:1;min-width:0;line-height:1.3}.ir .q{font-size:1.3rem;font-weight:700;min-width:2.2rem;text-align:right}.ir .q.low{color:var(--red)}
.ir button{min-height:40px;padding:.3rem .7rem}
#msub button{min-height:46px}
#instbar{position:fixed;left:.6rem;right:.6rem;bottom:calc(1rem + env(safe-area-inset-bottom));z-index:45;max-width:520px;margin:0 auto;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.8rem;box-shadow:0 6px 24px #0003}
#instbar img{border-radius:9px;flex:0 0 40px}
#instbar p{margin:0;flex:1 1 180px;font-size:.95rem;line-height:1.3}
#instbar .acts{flex:1 1 100%;margin:0}#instbar .acts button{flex:1}
#new .pl{display:none}
@media (max-width:700px){
 #app:not([hidden]) ~ #instbar{bottom:calc(84px + env(safe-area-inset-bottom))}
 #new{width:58px;height:58px;min-height:58px;padding:0;font-size:2rem;line-height:1}
 #new .pl{display:inline}#new .lb{display:none}
 .acts [data-m]{flex:1 1 100%}.acts [data-e],.acts [data-d]{flex:1 1 40%}
 #mrange button{padding:.4rem .15rem;font-size:.9rem}
}
</style>
</head>
<body>

<p id="boot" style="max-width:420px;margin:18vh auto;padding:0 1rem;text-align:center;color:#5E6B67">Cargando…</p>
<script>
// Si algo impide que la app arranque, lo muestra en pantalla en lugar de dejarla en blanco
(function(){
  var b=function(m){var e=document.getElementById("boot");if(e){e.style.color="#B3402A";e.textContent=m;}};
  addEventListener("error",function(ev){var t=ev.target&&(ev.target.src||ev.target.href);b(t?"No se pudo cargar: "+t.split("/").pop()+". Revisa que el archivo esté publicado.":"Error: "+ev.message);},true);
  addEventListener("unhandledrejection",function(ev){b("Error: "+(ev.reason&&ev.reason.message||ev.reason));});
  setTimeout(function(){var e=document.getElementById("boot");if(e&&e.textContent==="Cargando…")e.textContent="Sigue cargando… si no cambia, revisa tu conexión y que app.js esté publicado.";},8000);
})();
</script>

<section id="login" class="box" hidden>
  <h1 style="margin-top:0">Inventario</h1>
  <label for="em">Correo</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password">
  <p class="err" id="lerr"></p>
  <button id="go" style="width:100%">Entrar</button>
  <button type="button" class="sec" id="forgot" style="width:100%;margin-top:.6rem;border-color:transparent">¿Olvidaste tu contraseña?</button>
  <button class="sec" id="inst2" hidden style="width:100%;margin-top:.6rem">Instalar app</button>
  <p class="mute" id="insttip" hidden style="margin-bottom:0"></p>
</section>

<section id="noacc" class="box" hidden>
  <h1 style="margin-top:0">Sin acceso</h1>
  <p>Tu cuenta existe, pero no está dada de alta o está desactivada. Pide a un administrador que la active.</p>
  <button class="sec" id="out2">Salir</button>
</section>

<div id="app" hidden>
  <header>
    <h1>Inventario</h1>
    <nav>
      <button data-t="cat" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></svg><span>Catálogo</span></button>
      <button data-t="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h6"/></svg><span>Inventario</span></button>
      <button data-t="mov"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 4L4 7M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/></svg><span>Movimientos</span></button>
      <button data-t="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Ajustes</span></button>
      <button data-t="usr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6M17 5a3.5 3.5 0 010 7M21.5 20c0-3-1.5-5-4-5.7"/></svg><span>Usuarios</span></button>
    </nav>
    <div class="r"><span id="who"></span><button id="inst" hidden>Instalar app</button><button id="out">Salir</button></div>
  </header>
  <main>
    <section id="cat">
      <div class="bar"><input id="q" placeholder="Buscar producto…" aria-label="Buscar"><select id="qc" aria-label="Categoría" style="max-width:200px"></select><button id="new" aria-label="Nuevo producto"><span class="pl">+</span><span class="lb">Nuevo producto</span></button></div>
      <div class="grid" id="list"></div>
    </section>

    <section id="inv" hidden>
      <div class="panel">
        <label for="iq" style="margin-top:0">Buscar</label>
        <input id="iq" type="search" placeholder="Buscar producto…">
        <div class="row r2"><div><label for="ig">Agrupar por</label><select id="ig"></select></div><div><label for="il">Ubicación</label><select id="il"></select></div></div>
        <div class="row r2"><div><label for="ic">Categoría</label><select id="ic"></select></div><div><label for="is">Existencia</label><select id="is"><option value="">Todos</option><option value="con">Con existencia</option><option value="agotado">Agotados</option></select></div></div>
        <label for="iasof">Existencia al día (vacío = hoy)</label><input id="iasof" type="date">
        <p class="mute" id="iasnote" style="margin:.3rem 0 0"></p>
      </div>
      <div class="kpis" id="ikpi"></div>
      <div id="ilist"></div>
      <button class="sec" id="icsv" style="width:100%;margin-top:.6rem">Exportar a CSV</button>
    </section>

    <section id="mov" hidden>
      <div class="seg" id="msub" style="margin-bottom:.8rem"><button type="button" data-s="reg" class="on">Registrar</button><button type="button" data-s="his">Historial</button></div>
      <div id="mreg">
      <div class="panel" id="mform">
        <div class="seg" id="mtseg" role="group" aria-label="Tipo de movimiento">
          <button type="button" data-v="in" class="on">Entrada</button><button type="button" data-v="out">Salida</button><button type="button" data-v="transfer">Traslado</button>
        </div>
        <input type="hidden" id="mt" value="in">
        <label for="mps">Producto</label>
        <input id="mps" type="search" placeholder="Buscar por parte o descripción" autocomplete="off">
        <select id="mp" aria-label="Producto" style="margin-top:.4rem"></select>
        <p class="mute" id="minfo" style="margin:.3rem 0 0"></p>
        <div class="row">
          <div><label for="ml" id="mll">Ubicación</label><select id="ml"></select></div>
          <div id="mdw" hidden><label for="md">Destino</label><select id="md"></select></div>
        </div>
        <label for="mq">Cantidad</label>
        <div class="step"><button type="button" id="qm" aria-label="Menos">−</button><input id="mq" type="number" inputmode="numeric" min="1" value="1"><button type="button" id="qp" aria-label="Más">+</button></div>
        <label for="mdt">Fecha del movimiento</label><input id="mdt" type="date">
        <label for="mn">Nota (proveedor, cliente, folio…)</label><input id="mn">
        <p class="err" id="merr" role="alert"></p>
        <button id="mgo" style="width:100%;min-height:54px;font-size:1.1rem">Registrar movimiento</button>
      </div>
      <h3 class="gh"><span>Últimos movimientos</span></h3>
      <div id="mlist"></div>
      </div>
      <div id="mhis" hidden>
        <div class="panel">
          <div class="seg" id="mrange" role="group" aria-label="Periodo">
            <button type="button" data-d="0">Hoy</button><button type="button" data-d="7" class="on">7 días</button><button type="button" data-d="m">Este mes</button><button type="button" data-d="c">Fechas</button>
          </div>
          <div class="row r2" id="mdates" hidden><div><label for="hf">Desde</label><input id="hf" type="date"></div><div><label for="ht">Hasta</label><input id="ht" type="date"></div></div>
          <div class="row r2"><div><label for="hty">Tipo</label><select id="hty"><option value="">Todos</option><option value="in">Entradas</option><option value="out">Salidas</option><option value="transfer">Traslados</option></select></div><div><label for="hl">Ubicación</label><select id="hl"></select></div></div>
          <div class="row r2"><div><label for="hq">Producto o nota</label><input id="hq" type="search" placeholder="Buscar…"></div><div><label for="hu">Usuario</label><select id="hu"></select></div></div>
        </div>
        <div class="seg" id="hview" style="margin-bottom:.8rem"><button type="button" data-v="l" class="on">Lista</button><button type="button" data-v="r">Resumen por producto</button></div>
        <div class="kpis" id="hkpi"></div>
        <div id="hlist"></div>
        <button class="sec" id="hcsv" style="width:100%;margin-top:.6rem">Exportar a CSV</button>
      </div>
    </section>

    <section id="cam" hidden></section>

    <section id="usr" hidden>
      <div class="panel">
        <h2 style="margin-top:0;font-size:1.1rem">Nuevo usuario</h2>
        <div class="row">
          <div><label for="un">Nombre</label><input id="un"></div>
          <div><label for="ue">Correo</label><input id="ue" type="email"></div>
        </div>
        <div class="row">
          <div><label for="up">Contraseña temporal (mínimo 6 caracteres)</label><input id="up" autocomplete="off"></div>
          <div><label for="ur">Rol</label><select id="ur"></select></div>
        </div>
        <label style="display:flex;gap:.5rem;align-items:center;font-weight:400"><input type="checkbox" id="usend" checked> Enviarle un correo para que defina su propia contraseña</label>
        <p class="err" id="uerr"></p>
        <button id="ugo">Crear usuario</button>
        <p class="mute" id="rolehelp"></p>
      </div>
      <div id="ulist"></div>
    </section>
  </main>
</div>

<div id="instbar" role="dialog" aria-label="Instalar app" hidden>
  <img src="icons/icon-192.png" alt="" width="40" height="40">
  <p id="instmsg"></p>
  <div class="acts"><button id="instgo">Instalar</button><button class="sec" id="instno">Ahora no</button></div>
</div>
<div id="toast" role="status" hidden></div>

<dialog id="dlg">
  <form method="dialog" id="pf" style="margin:0">
    <h2 id="dt" style="margin-top:0"></h2>
    <div id="fields"></div>
    <label>Imágenes del producto (la primera es la portada)</label>
    <div id="thumbs" class="row" style="flex-wrap:wrap;justify-content:flex-start"></div>
    <div class="acts"><button type="button" class="sec" id="cambtn">Tomar foto</button><button type="button" class="sec" id="galbtn">Subir desde galería</button></div>
    <input id="img" type="file" accept="image/*" multiple hidden>
    <input id="imgcam" type="file" accept="image/*" capture="environment" hidden>
    <p class="err" id="perr"></p>
    <div class="acts sheetbar"><button type="button" id="save">Guardar producto</button><button type="button" class="sec" id="cancel">Cancelar</button></div>
  </form>
</dialog>

<dialog id="camdlg">
  <h2 style="margin-top:0">Tomar foto</h2>
  <video id="cv" autoplay playsinline muted style="width:100%;border-radius:8px;background:#000"></video>
  <p class="mute" id="cmsg" role="status" style="min-height:1.4rem"></p>
  <div class="acts"><button type="button" id="snap">Capturar</button><button type="button" class="sec" id="camdone">Listo</button></div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
